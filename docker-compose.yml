services:
  postgres:
    image: postgres:17-alpine
    container_name: nextjssocialmedia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nextjssocialmedia
      POSTGRES_PASSWORD: nextjssocialmedia
      POSTGRES_DB: nextjssocialmedia
    ports:
      - "5434:5432"
    volumes:
      - nextjssocialmedia-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextjssocialmedia -d nextjssocialmedia"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nextjssocialmedia-pgdata:
